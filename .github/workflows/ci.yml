name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests, build and source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
    steps:
      - name: Check out the proposed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          check-latest: false
          package-manager-cache: false

      - name: Use the pinned npm version
        run: npm install --global --ignore-scripts --save-exact --no-audit --no-fund --registry=https://registry.npmjs.org npm@11.9.0

      - name: Verify dependency sources before installation
        run: npm run check:dependencies

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit

      - name: Check current advisories and pinned malware indicators
        run: node tools/ci/check.mjs --security

      - name: Run the reproducible project checks
        run: node tools/ci/check.mjs

      - name: Confirm checks did not rewrite tracked inputs
        run: git diff --exit-code
